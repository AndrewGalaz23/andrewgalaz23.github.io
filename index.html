---
layout: default
custom_css:
- assets/css/home.css
---

<section style="text-align: center;">

	<img class="profile" src="{{ 'assets/images/profile.jpg' | relative_url }}" alt="">
	<h1 translate="no">{{ site.title }}</h1>
	<div translate="no"><span class="handle-prefix">@</span>{{ site.username }}</div>

	<ul class="icon-links">
		{% for item in site.data.socials %}
		<li class="animate">
			<a href="{{item.link}}" target="social-{{ item.id }}" title="{{ item.name }}" data-social="{{ item.id }}">
				<svg class="icon" aria-label="{{ item.name }}: {{ item.link }}">
					<title>{{ item.name }}</title>
					<desc>{{ item.link }}</desc>
					<use href="{{ site.svg_icons | append: '#' | append: item.id | relative_url }}"></use>
				</svg>
			</a>
		</li>
		{% endfor %}
	</ul>

</section>
