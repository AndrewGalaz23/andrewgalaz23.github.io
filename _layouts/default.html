---
<!DOCTYPE html>
<html lang="{{ site.lang }}">
	<head>
		<meta charset="utf-8">

		<title>
			{% if page.title %}
				{{ page.title }}
			{% else %}
				{{ site.title }}
			{% endif %}
		</title>

		<!-- Style -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}" type="text/css">
		{% if page.custom_css %}
			{% for css in page.custom_css %}
				<link rel="stylesheet" href="{{ css | relative_url }}">
			{% endfor %}
		{% endif %}

	</head>
	<body>

		<!-- Main content -->
		<main>{{ content }}</main>

	</body>
</html>
